http_port 3128
visible_hostname terminal_egress_proxy

acl allowed_ssl_ports port 443
acl CONNECT method CONNECT

# Phase 3 allowlist: Claude Code CLI needs more than just the API host -
# it also talks to platform.claude.com (auth/telemetry) and other
# *.anthropic.com/*.claude.com endpoints, so allow those two parent domains
# rather than whack-a-moling individual subdomains. Plus git operations
# (github.com/api.github.com/codeload.github.com). Nothing else may leave
# terminal_egress_net through this proxy.
acl allowed_dst_domains dstdomain .anthropic.com
acl allowed_dst_domains dstdomain .claude.com
acl allowed_dst_domains dstdomain github.com
acl allowed_dst_domains dstdomain api.github.com
acl allowed_dst_domains dstdomain codeload.github.com

# The platform's own public API, so a workspace's RG_WORKSPACE_TOKEN can
# call Agent OS/Builder endpoints from inside the terminal (see
# RG_Auth's WorkspaceAccessToken). Same trust tier as the entries above -
# the scoped token, not this allowlist, is what limits what Claude can
# actually do once it can reach this domain.
acl allowed_dst_domains dstdomain dev-swat.com
acl allowed_dst_domains dstdomain .dev-swat.com

# This proxy is itself dual-homed on app-network - explicitly block it from
# ever being used to pivot from the sandboxed network into internal service
# IPs, the host, or link-local metadata endpoints.
acl private_dst dst 10.0.0.0/8
acl private_dst dst 172.16.0.0/12
acl private_dst dst 192.168.0.0/16
acl private_dst dst 127.0.0.0/8
acl private_dst dst 169.254.0.0/16

http_access deny private_dst
http_access deny CONNECT !allowed_ssl_ports
http_access allow CONNECT allowed_dst_domains
http_access deny CONNECT
http_access deny all
