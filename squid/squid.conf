http_port 3128
visible_hostname terminal_egress_proxy

acl allowed_ssl_ports port 443
acl CONNECT method CONNECT

# Phase 3 allowlist: Claude Code CLI (api.anthropic.com) + git operations
# (github.com/api.github.com/codeload.github.com). Nothing else may leave
# terminal_egress_net through this proxy.
acl allowed_dst_domains dstdomain api.anthropic.com
acl allowed_dst_domains dstdomain github.com
acl allowed_dst_domains dstdomain api.github.com
acl allowed_dst_domains dstdomain codeload.github.com

# This proxy is itself dual-homed on app-network - explicitly block it from
# ever being used to pivot from the sandboxed network into internal service
# IPs, the host, or link-local metadata endpoints.
acl private_dst dst 10.0.0.0/8
acl private_dst dst 172.16.0.0/12
acl private_dst dst 192.168.0.0/16
acl private_dst dst 127.0.0.0/8
acl private_dst dst 169.254.0.0/16

http_access deny private_dst
http_access deny CONNECT !allowed_ssl_ports
http_access allow CONNECT allowed_dst_domains
http_access deny CONNECT
http_access deny all
