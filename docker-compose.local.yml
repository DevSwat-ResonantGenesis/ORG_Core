version: '3.8'
networks:
  app-network:
    driver: bridge
  terminal_egress_net:
    name: terminal_egress_net
    driver: bridge
    internal: true
volumes:
  redis_data: null
  build_projects: null
  postgres_data: null
  memory_postgres_data: null
services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: resonant
      POSTGRES_PASSWORD: resonant_db_password_change_me
      POSTGRES_DB: resonant
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - 5432:5432
    networks:
    - app-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U resonant
      interval: 10s
      timeout: 5s
      retries: 5
  memory_postgres:
    image: pgvector/pgvector:pg15
    container_name: memory_postgres
    environment:
      POSTGRES_USER: resonant
      POSTGRES_PASSWORD: resonant_db_password_change_me
      POSTGRES_DB: resonant_memory
    volumes:
    - memory_postgres_data:/var/lib/postgresql/data
    ports:
    - 5433:5432
    networks:
    - app-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U resonant -d resonant_memory
      interval: 10s
      timeout: 5s
      retries: 5
  shared_redis:
    image: redis:7-alpine
    container_name: shared_redis
    command: redis-server --appendonly yes
    volumes:
    - redis_data:/data
    networks:
    - app-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 3
  gateway:
    build:
      context: /Users/louie/CascadeProjects/RG/RG_Gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
    - 0.0.0.0:8001:8000  # Exposed to Cloudflare tunnel at api.resonantgenesis.xyz
    env_file:
    - /Users/louie/CascadeProjects/RG/RG_core/.env.production
    environment:
      REDIS_URL: redis://shared_redis:6379/0
      GATEWAY_AUTH_URL: http://auth_service:8000
      GATEWAY_CHAT_URL: http://chat_service:8000
      GATEWAY_LLM_URL: http://llm_service:8000
      GATEWAY_BILLING_URL: http://billing_service:8000
      GATEWAY_MEMORY_URL: http://memory_service:8000
      GATEWAY_USER_URL: http://user_service:8000
      GATEWAY_WORKFLOW_URL: http://workflow_service:8000
      GATEWAY_STORAGE_URL: http://storage_service:8000
      AST_ANALYSIS_SERVICE_URL: http://rg_ast_analysis:8000
      GATEWAY_BLOCKCHAIN_URL: http://blockchain_service:8000
      GATEWAY_NOTIFICATION_URL: http://notification_service:8000
      GATEWAY_IDE_URL: http://ide_service:8000
      GATEWAY_CODE_EXECUTION_URL: http://code_execution_service:8002
      GATEWAY_AGENT_ENGINE_URL: http://agent_engine_service:8000
      TERMINAL_SANDBOX_URL: http://terminal_sandbox_service:8000
      TERMINAL_SANDBOX_INTERNAL_SERVICE_KEY: ${TERMINAL_SANDBOX_INTERNAL_SERVICE_KEY}
    depends_on:
    - shared_redis
    - postgres
    - auth_service
    networks:
    - app-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
  auth_service:
